name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY_IMAGE: geekgonecrazy/deepfreeze

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install host binaries used by the integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          curl -fsSL -o /tmp/mongodb-database-tools.deb \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.14.1.deb"
          sudo dpkg -i /tmp/mongodb-database-tools.deb
          mongodump --version
          age --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs unit + integration tests (testcontainers spins up SeaweedFS and
      # a Mongo replica set with the Docker daemon available on the runner).
      # The integration test is skipped automatically if the host binaries
      # installed above are missing.
      - name: Test
        run: go test -tags integration ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # 'latest' tracks the default branch only; version tags come from
          # pushing a v* tag (e.g. v1.2.3 -> 1.2.3, 1.2).
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
